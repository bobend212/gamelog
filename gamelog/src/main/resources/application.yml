spring:
  application:
    name: The Library
  datasource:
    url: jdbc:postgresql://localhost:5432/thelibrarydb
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
#    show-sql: true
#    properties:
#      hibernate:
#        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
  main:
    banner-mode: off
  jackson:
    time-zone: Europe/Warsaw

server:
  port: 8080

#logging:
#  level:
#    com.gamelibrary: DEBUG

rawg:
  api:
    url: ${RAWG_API_URL}
    key: ${RAWG_API_KEY}
    timeoutInSeconds: 10

tmdb:
  api:
    key: ${TMDB_API_KEY}
    url: ${TMDB_API_URL}
    timeoutInSeconds: 10
