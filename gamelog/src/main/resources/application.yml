spring:
  application:
    name: The Library
  datasource:
    url: jdbc:postgresql://localhost:5432/thelibrarydb
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  main:
    banner-mode: off

server:
  port: 8080

logging:
  level:
    com.gamelibrary: DEBUG

rawg:
  api:
    url: ${RAWG_API_URL}
    key: ${RAWG_API_KEY}
    timeoutInSeconds: 10

tmdb:
  api:
    key: ${TMDB_API_KEY}
