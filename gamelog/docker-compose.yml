version: '3.9'

name: the-library

services:
  postgres:
    image: postgres:15
    container_name: thelibrary-postgres
    environment:
      POSTGRES_DB: thelibrarydb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Warsaw
      PGTZ: Europe/Warsaw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: thelibrary-backend
    build:
      context: .
    container_name: thelibrary-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thelibrarydb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RAWG_API_URL: ${RAWG_API_URL}
      RAWG_API_KEY: ${RAWG_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_API_URL: ${TMDB_API_URL}
      IGDB_API_URL: ${IGDB_API_URL}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_AUTH_TOKEN_URL: ${IGDB_AUTH_TOKEN_URL}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
    depends_on:
      - postgres

  frontend:
    image: thelibrary-frontend
    build:
      context: ../gamelog-frontend
    container_name: thelibrary-frontend
    ports:
      - "3000:3000"
    volumes:
      - ../gamelog-frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
    external: true
    name: gamelog_pgdata
